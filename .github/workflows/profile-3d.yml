# Regenerates the isometric 3D contribution calendar shown in README.md.
# Output: profile-3d-contrib/profile-3d-light.svg and profile-3d-contrib/profile-3d-dark.svg
# Colors, file names, and labels live in .github/profile-3d-settings.json.
name: Profile 3D contribution calendar

on:
  schedule:
    # Daily at 07:17 UTC (about 3 AM in Fort Wayne). Off the top of the hour to avoid queue spikes.
    - cron: "17 7 * * *"
  workflow_dispatch:

# The default GITHUB_TOKEN only needs to push the regenerated SVGs back to this repo.
permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    name: Generate 3D contribution calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the profile repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render the calendar SVGs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json

      - name: Commit the SVGs if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "Calendar unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update 3D contribution calendar"
          git push
