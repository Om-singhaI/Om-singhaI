name: Update skyline

on:
  schedule:
    - cron: "17 6 * * *"   # daily, off the hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-skyline
  cancel-in-progress: false

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch merged pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_merged.py

      - name: Build skyline SVGs
        run: python3 scripts/build_skyline.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- assets/skyline scripts/merged.json)" ]; then
            echo "Skyline unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/skyline scripts/merged.json
          git commit -m "Update skyline"
          git push
